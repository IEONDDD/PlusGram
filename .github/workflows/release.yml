name: Release Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub pre-release and send APK to the configured Telegram channel'
        type: boolean
        default: false
      baseline_tag:
        description: 'GitHub release containing the signed Plusgram 5.0.0 APK'
        type: string
        default: v5.0.0
      baseline_asset:
        description: 'Asset name of the signed Plusgram 5.0.0 APK'
        type: string
        default: Plusgram-v5.0.0.apk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
      PUBLISH_RELEASE: ${{ inputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust Android targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0 platforms;android-36 platforms;android-35 cmake;3.31.6"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [[ "$PUBLISH_RELEASE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Publishing requires the main branch."
            exit 1
          fi
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > TMessagesProj/release.keystore
            echo "signing key restored"
          elif [[ "$PUBLISH_RELEASE" == true ]]; then
            echo "::error::Publishing requires RELEASE_KEYSTORE."
            exit 1
          else
            echo "RELEASE_KEYSTORE не задан — сборка подпишется отладочным ключом"
          fi
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew -PrustTextEnabled=true "-PrequireReleaseSigning=$PUBLISH_RELEASE" TMessagesProj:assembleRelease
      - name: Verify release APK
        run: |
          shopt -s nullglob
          apks=(TMessagesProj/build/outputs/apk/release/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected one universal release APK."
            exit 1
          fi
          apk="${apks[0]}"
          echo "PLUSGRAM_APK=$apk" >> "$GITHUB_ENV"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          signature=$("$tools/apksigner" verify --print-certs "$apk")
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            expected='1837e4fedc2035971feba8a3ee04a744d894732522e8523745c4016dee64ddfa'
            actual=$(awk '/^Signer #[0-9]+ certificate SHA-256 digest: / {print $NF}' <<< "$signature")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::APK must be signed by the production certificate used for Plusgram 5.0.0."
              exit 1
            fi
          fi
          for abi in arm64-v8a x86_64; do
            unzip -t "$apk" "lib/$abi/libplusgram_text.so"
          done
          python Tools/check_release_privacy.py --apk "$apk" --report "$RUNNER_TEMP/plusgram-privacy.json"
      - name: Download previous release APK
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
          BASELINE_ASSET: ${{ inputs.baseline_asset }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$BASELINE_ASSET" \
            --output "$RUNNER_TEMP/plusgram-5.0.0.apk" -- "$BASELINE_TAG"
      - name: Enable KVM for Android smoke test
        if: ${{ inputs.publish }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check upgrade and diagnostics on Android
        if: ${{ inputs.publish }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python Tools/smoke_android_upgrade.py "$RUNNER_TEMP/plusgram-5.0.0.apk" "$PLUSGRAM_APK"
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: ${{ env.PLUSGRAM_APK }}
          if-no-files-found: error
      - name: Publish GitHub pre-release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ci-$SHORT"
          NOTES=$(jq -r '(.commits // []) | map("• " + (.message | split("\n")[0])) | join("\n")' "$GITHUB_EVENT_PATH")
          if [ -z "$NOTES" ]; then
            NOTES="CI build $SHORT"
          fi
          gh release create "$TAG" "$PLUSGRAM_APK" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Plusgram CI $SHORT" --notes "$NOTES"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.tagName | startswith("ci-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
      - name: Send APK to Telegram
        if: ${{ github.ref == 'refs/heads/main' && inputs.publish && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py
